# Strict, officially supported syntax schema layout for SAP Integration Suite Artifacts 2.0
general:
  pipelineVersion: "2.0"

stages:
  Upload:
    enabled: true
    # Native 2.0 configuration structure to activate the built-in lint execution block
    sapCPILint:
      enabled: true
      rulesFile: "cpilint-rules.xml"

  Deploy:
    enabled: true

  'Integration Test':
    enabled: false
